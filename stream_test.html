<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FunASR 流式识别测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: rgba(26, 26, 46, 0.9);
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        .header h1 {
            font-size: 22px;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .server-input {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 8px 15px;
            color: #fff;
            font-size: 13px;
            width: 220px;
        }
        .server-input:focus {
            outline: none;
            border-color: #667eea;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            font-size: 13px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #666;
        }
        .status-dot.connected { background: #00e676; box-shadow: 0 0 10px #00e676; }
        .status-dot.recording { background: #ff5252; animation: pulse 1s infinite; }
        .status-dot.error { background: #ff5252; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        button {
            padding: 16px 50px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #startBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        #startBtn:hover:not(:disabled) { 
            transform: translateY(-3px); 
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }
        #startBtn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        #stopBtn {
            background: linear-gradient(135deg, #ff5252 0%, #d32f2f 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 82, 82, 0.4);
        }
        #stopBtn:hover:not(:disabled) { 
            transform: translateY(-3px); 
            box-shadow: 0 8px 25px rgba(255, 82, 82, 0.5);
        }
        #stopBtn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .transcript-area {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 25px;
            flex: 1;
            min-height: 300px;
            backdrop-filter: blur(10px);
        }
        .transcript-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }
        #currentText {
            font-size: 20px;
            line-height: 1.8;
            color: #fff;
            min-height: 80px;
            margin-bottom: 20px;
        }
        #currentText .partial {
            color: #888;
            font-style: italic;
        }
        .history-area {
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 20px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }
        .history-item {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .history-item:last-child { border-bottom: none; }
        .history-item .time {
            font-size: 12px;
            color: #667eea;
            min-width: 70px;
            padding-top: 2px;
        }
        .history-item .text {
            color: #ccc;
            font-size: 15px;
            line-height: 1.6;
        }
        .stats-bar {
            text-align: center;
            padding: 15px;
            font-size: 13px;
            color: #888;
        }
        .stats-bar span {
            color: #667eea;
            font-weight: 600;
        }
        .error-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ff5252 0%, #d32f2f 100%);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(255, 82, 82, 0.4);
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: #555;
        }
        .empty-state svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>FunASR 流式识别测试</h1>
        <div class="header-right">
            <input type="text" class="server-input" id="serverUrl" placeholder="流式服务地址">
            <div class="status-badge">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">未连接</span>
            </div>
        </div>
    </div>

    <div class="main">
        <div class="controls">
            <button id="startBtn" onclick="startStream()">开始说话</button>
            <button id="stopBtn" onclick="stopStream()" disabled>停止</button>
        </div>

        <div class="transcript-area">
            <div class="transcript-label">实时识别结果</div>
            <div id="currentText">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                    <span>点击「开始说话」开始录音识别</span>
                </div>
            </div>
            
            <div class="history-area" id="historyArea" style="display: none;">
                <div class="transcript-label">识别历史</div>
                <div id="historyItems"></div>
            </div>
        </div>

        <div class="stats-bar" id="statsBar"></div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        const SAMPLE_RATE = 16000;
        const CHUNK_MS = 600;

        // 自动检测服务器地址 (根据当前页面协议)
        (function() {
            const proto = window.location.protocol === 'https:' ? 'https' : 'http';
            const host = window.location.hostname || '8.153.92.96';
            const port = 5002;
            document.getElementById('serverUrl').value = `${proto}://${host}:${port}`;
        })();

        let socket = null;
        let mediaStream = null;
        let audioContext = null;
        let processor = null;
        let isStreaming = false;
        let audioBuffer = [];
        let chunkCount = 0;
        let startTime = null;
        let historyItems = [];

        function showError(msg) {
            const toast = document.createElement('div');
            toast.className = 'error-toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        }

        function setStatus(status, text) {
            document.getElementById('statusDot').className = 'status-dot ' + status;
            document.getElementById('statusText').textContent = text;
        }

        function connect() {
            const serverUrl = document.getElementById('serverUrl').value;
            
            if (socket) {
                socket.disconnect();
            }

            socket = io(serverUrl, {
                transports: ['websocket'],
                reconnection: false,
                timeout: 10000
            });

            socket.on("connect", () => {
                setStatus("connected", "已连接");
                console.log("已连接到流式服务");
            });

            socket.on("connected", (data) => {
                console.log("服务就绪:", data);
            });

            socket.on("started", (data) => {
                console.log("会话已启动:", data);
            });

            socket.on("recognition_result", (data) => {
                const text = data.text || "";
                const isPartial = data.is_partial || data.partial;
                
                if (text) {
                    if (isPartial) {
                        document.getElementById('currentText').innerHTML = 
                            `<span class="partial">${text}</span>`;
                    } else {
                        document.getElementById('currentText').innerHTML = text;
                        addHistory(text);
                    }
                }
                
                chunkCount++;
                const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                document.getElementById('statsBar').innerHTML = 
                    `已识别 <span>${chunkCount}</span> 个音频块 | 耗时 <span>${elapsed}s</span>`;
            });

            socket.on("finished", (data) => {
                console.log("识别完成:", data);
                const text = data.text || "";
                if (text) {
                    document.getElementById('currentText').innerHTML = text;
                    addHistory(text);
                }
                document.getElementById('statsBar').innerHTML = 
                    `完成 | 耗时 <span>${data.duration || ((Date.now() - startTime) / 1000).toFixed(1)}s</span> | <span>${data.chunks || chunkCount}</span> 个音频块`;
            });

            socket.on("error", (data) => {
                console.error("服务端错误:", data);
                showError("错误: " + (data.message || JSON.stringify(data)));
                setStatus("error", "错误");
            });

            socket.on("disconnect", () => {
                setStatus("", "已断开");
                console.log("已断开连接");
            });

            socket.on("connect_error", (err) => {
                showError("连接失败: " + err.message);
                setStatus("error", "连接失败");
            });
        }

        async function startStream() {
            try {
                connect();

                // 等待连接
                if (!socket.connected) {
                    setStatus("", "正在连接...");
                    const connected = await new Promise((resolve) => {
                        const timer = setTimeout(() => resolve(false), 10000);
                        socket.once("connect", () => { clearTimeout(timer); resolve(true); });
                        socket.once("connect_error", () => { clearTimeout(timer); resolve(false); });
                    });
                    if (!connected) {
                        setStatus("error", "连接超时");
                        return;
                    }
                }

                // 请求麦克风权限
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                // 创建音频处理
                audioContext = new AudioContext({ sampleRate: SAMPLE_RATE });
                const source = audioContext.createMediaStreamSource(mediaStream);
                processor = audioContext.createScriptProcessor(4096, 1, 1);
                source.connect(processor);
                processor.connect(audioContext.destination);

                processor.onaudioprocess = (e) => {
                    if (!isStreaming) {
                        console.log('[DEBUG] isStreaming is false, skipping');
                        return;
                    }
                    
                    const inputData = e.inputBuffer.getChannelData(0);
                    const pcmData = new Int16Array(inputData.length);
                    for (let i = 0; i < inputData.length; i++) {
                        pcmData[i] = Math.max(-32768, Math.min(32767, inputData[i] * 32767));
                    }
                    audioBuffer.push(pcmData);

                    const minSamples = (SAMPLE_RATE * CHUNK_MS) / 1000;
                    const totalSamples = audioBuffer.reduce((s, c) => s + c.length, 0);

                    if (totalSamples >= minSamples) {
                        const merged = new Int16Array(totalSamples);
                        let offset = 0;
                        for (const chunk of audioBuffer) {
                            merged.set(chunk, offset);
                            offset += chunk.length;
                        }
                        audioBuffer = [];
                        
                        // Base64 编码
                        const bytes = new Uint8Array(merged.buffer);
                        let binary = '';
                        for (let i = 0; i < bytes.length; i++) {
                            binary += String.fromCharCode(bytes[i]);
                        }
                        const base64 = btoa(binary);
                        
                        console.log(`[DEBUG] Sending audio chunk, size: ${base64.length} bytes, socket connected: ${socket.connected}`);
                        socket.emit("audio", { audio: base64, is_final: false });
                        chunkCount++;
                    }
                };

                // 通知服务端开始
                socket.emit("start", { sample_rate: SAMPLE_RATE });
                
                isStreaming = true;
                chunkCount = 0;
                startTime = Date.now();
                audioBuffer = [];

                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                setStatus("recording", "正在识别...");
                document.getElementById('currentText').innerHTML = 
                    '<span class="partial">请说话...</span>';
                document.getElementById('statsBar').innerHTML = '';

            } catch (err) {
                console.error("启动失败:", err);
                showError("启动失败: " + err.message);
                setStatus("error", "启动失败");
            }
        }

        function stopStream() {
            isStreaming = false;

            // 发送剩余音频
            if (audioBuffer.length > 0) {
                const totalSamples = audioBuffer.reduce((s, c) => s + c.length, 0);
                const merged = new Int16Array(totalSamples);
                let offset = 0;
                for (const chunk of audioBuffer) {
                    merged.set(chunk, offset);
                    offset += chunk.length;
                }
                audioBuffer = [];
                const bytes = new Uint8Array(merged.buffer);
                let binary = '';
                for (let i = 0; i < bytes.length; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                const base64 = btoa(binary);
                socket.emit("audio", { audio: base64, is_final: true });
            }

            // 通知结束
            socket.emit("end");

            // 清理
            if (processor) processor.disconnect();
            if (audioContext) audioContext.close();
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());

            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            setStatus("connected", "已停止");
        }

        function addHistory(text) {
            if (!text) return;
            const now = new Date();
            const time = now.toTimeString().slice(0, 8);
            historyItems.unshift({ time, text });
            if (historyItems.length > 20) historyItems.pop();
            renderHistory();
        }

        function renderHistory() {
            const area = document.getElementById('historyArea');
            const items = document.getElementById('historyItems');
            
            if (historyItems.length === 0) {
                area.style.display = 'none';
                return;
            }
            
            area.style.display = 'block';
            items.innerHTML = historyItems.map(h => `
                <div class="history-item">
                    <span class="time">${h.time}</span>
                    <span class="text">${escapeHtml(h.text)}</span>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 页面加载时自动连接
        connect();
    </script>
</body>
</html>
