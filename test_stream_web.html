<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FunASR 流式识别测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
        }
        .status-dot.connected { background: #4caf50; }
        .status-dot.recording { background: #f44336; animation: pulse 1s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .status-text {
            font-size: 14px;
            color: #666;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        button {
            padding: 15px 40px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        #startBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        #startBtn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102,126,234,0.4); }
        #startBtn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        #stopBtn {
            background: #f44336;
            color: white;
        }
        #stopBtn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(244,67,54,0.4); }
        #stopBtn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .result-box {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
        }
        .result-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #partialResult {
            color: #999;
            font-style: italic;
            margin-bottom: 10px;
            min-height: 24px;
        }
        #finalResult {
            color: #333;
            line-height: 1.8;
        }
        .sentence {
            background: #e3f2fd;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: inline-block;
        }
        .sentence .time {
            font-size: 11px;
            color: #666;
            margin-right: 8px;
        }
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        .server-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .server-input:focus {
            outline: none;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>FunASR 流式识别测试</h1>
        <p class="subtitle">使用麦克风实时录音，测试流式语音识别服务</p>
        
        <input type="text" class="server-input" id="serverUrl" value="http://8.153.92.96:5002" placeholder="服务器地址">
        
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span class="status-text" id="statusText">未连接</span>
        </div>
        
        <div class="controls">
            <button id="startBtn" onclick="startRecording()">开始录音</button>
            <button id="stopBtn" onclick="stopRecording()" disabled>停止录音</button>
        </div>
        
        <div class="result-box">
            <div class="result-label">实时结果</div>
            <div id="partialResult">等待录音...</div>
            <div class="result-label" style="margin-top: 15px;">最终结果</div>
            <div id="finalResult"></div>
        </div>
        
        <div class="error" id="errorMsg"></div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        let socket = null;
        let mediaStream = null;
        let audioContext = null;
        let processor = null;
        let isRecording = false;

        function showError(msg) {
            const errorEl = document.getElementById('errorMsg');
            errorEl.textContent = msg;
            errorEl.style.display = 'block';
            setTimeout(() => errorEl.style.display = 'none', 5000);
        }

        function updateStatus(status, text) {
            const dot = document.getElementById('statusDot');
            const txt = document.getElementById('statusText');
            dot.className = 'status-dot ' + status;
            txt.textContent = text;
        }

        async function startRecording() {
            const serverUrl = document.getElementById('serverUrl').value;
            
            try {
                // 请求麦克风权限
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        channelCount: 1,
                        sampleRate: 16000,
                        echoCancellation: true,
                        noiseSuppression: true
                    } 
                });

                // 连接 WebSocket
                socket = io(serverUrl, {
                    transports: ['websocket'],
                    reconnection: false
                });

                socket.on('connect', () => {
                    updateStatus('connected', '已连接');
                    document.getElementById('startBtn').disabled = true;
                    document.getElementById('stopBtn').disabled = false;
                    startAudioProcessing();
                });

                socket.on('disconnect', () => {
                    updateStatus('', '已断开');
                    stopRecording();
                });

                socket.on('partial_result', (data) => {
                    if (data.text) {
                        document.getElementById('partialResult').textContent = data.text;
                    }
                });

                socket.on('final_result', (data) => {
                    if (data.text) {
                        const finalEl = document.getElementById('finalResult');
                        const sentence = document.createElement('div');
                        sentence.className = 'sentence';
                        sentence.innerHTML = `<span class="time">[${data.start || ''} --> ${data.end || ''}]</span>${data.text}`;
                        finalEl.appendChild(sentence);
                        finalEl.scrollTop = finalEl.scrollHeight;
                        document.getElementById('partialResult').textContent = '';
                    }
                });

                socket.on('error', (data) => {
                    showError('服务器错误: ' + JSON.stringify(data));
                });

                socket.on('connect_error', (err) => {
                    showError('连接失败: ' + err.message);
                    updateStatus('', '连接失败');
                });

            } catch (err) {
                showError('无法访问麦克风: ' + err.message);
            }
        }

        function startAudioProcessing() {
            // 创建音频处理上下文
            audioContext = new (window.AudioContext || window.webkitAudioContext)({
                sampleRate: 16000
            });
            
            const source = audioContext.createMediaStreamSource(mediaStream);
            
            // 使用 ScriptProcessorNode 处理音频 (兼容性最好)
            processor = audioContext.createScriptProcessor(4096, 1, 1);
            
            processor.onaudioprocess = (e) => {
                if (!isRecording || !socket || !socket.connected) return;
                
                const inputData = e.inputBuffer.getChannelData(0);
                
                // 转换为 16-bit PCM
                const pcm16 = new Int16Array(inputData.length);
                for (let i = 0; i < inputData.length; i++) {
                    const s = Math.max(-1, Math.min(1, inputData[i]));
                    pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }
                
                // Base64 编码并发送
                const bytes = new Uint8Array(pcm16.buffer);
                let binary = '';
                for (let i = 0; i < bytes.length; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                const base64 = btoa(binary);
                
                socket.emit('audio_chunk', { audio: base64 });
            };
            
            source.connect(processor);
            processor.connect(audioContext.destination);
            
            isRecording = true;
            updateStatus('recording', '录音中...');
        }

        function stopRecording() {
            isRecording = false;
            
            if (processor) {
                processor.disconnect();
                processor = null;
            }
            
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            
            if (socket) {
                socket.emit('end_stream', {});
                setTimeout(() => socket.disconnect(), 500);
                socket = null;
            }
            
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            updateStatus('connected', '已停止');
        }
    </script>
</body>
</html>
